<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Local Spreadsheet</title>
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 24px; background-color: #fafafa; color: #1a1a1a; }
        .box { max-width: 1400px; margin: 0 auto; background: #ffffff; padding: 24px; border-radius: 12px; border: 1px solid #e5e5e5; }
        #login-box { max-width: 400px; margin: 120px auto; padding: 32px; text-align: center; background: #ffffff; border-radius: 12px; border: 1px solid #e5e5e5; }
        .input-group { margin-bottom: 16px; display: flex; flex-direction: column; text-align: left; }
        .input-group label { margin-bottom: 6px; font-weight: 500; font-size: 13px; color: #666; }
        input { padding: 10px 12px; border: 1px solid #dcdcdc; border-radius: 6px; font-size: 14px; width: 100%; transition: border 0.2s; background: #ffffff; color: #111111; }
        input:focus { outline: none; border-color: #000; }
        
        button { padding: 10px 16px; border: 1px solid #dcdcdc; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 500; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; background: transparent; color: #111111; }
        button:hover { background: #fafafa; border-color: #000000; }
        .btn-action-primary { border-color: #111111; font-weight: 600; width: 100%; margin-top: 8px; }
        .btn-action-primary:hover { background: #111111; color: #ffffff; }
        
        .copy-btn { background: transparent; border: none; padding: 2px 4px; font-size: 13px; cursor: pointer; margin-left: 6px; color: #999999; font-weight: bold; transition: all 0.2s ease; display: inline-flex; vertical-align: middle; }
        .copy-btn:hover { color: #111111; transform: scale(1.15); }
        
        #app { display: none; }
        .search-box { margin-bottom: 16px; }
        .search-box input { padding: 12px; }
        
        .toolbar { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: nowrap; align-items: stretch; background: #ffffff; padding: 0; }
        .col-service { flex: 1.5; min-width: 120px; }
        .col-url     { flex: 1.5; min-width: 120px; }
        .col-user    { flex: 2.5; min-width: 180px; }
        .col-pass    { flex: 2.5; min-width: 180px; }
        .col-remarks { flex: 4.0; min-width: 250px; }
        
        .spreadsheet-container { overflow-x: auto; border: 1px solid #eaeaea; border-radius: 8px; margin-top: 12px; }
        table { width: 100%; border-collapse: collapse; text-align: left; background: #ffffff; min-width: 1100px; }
        th { background-color: #f7f7f7; color: #555555; font-weight: 500; padding: 14px 12px; border-bottom: 1px solid #eaeaea; border-right: 1px solid #eaeaea; font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid #eaeaea; border-right: 1px solid #eaeaea; font-size: 14px; vertical-align: middle; }
        tr:hover { background-color: #fafafa; }
        .pwd-cell { font-family: monospace; font-size: 14px; cursor: pointer; color: #0066cc; user-select: none; }
        #toast { display: none; position: fixed; bottom: 24px; right: 24px; background:#111; color:#fff; padding:12px 24px; border-radius:6px; font-size:13px; z-index: 1000; }
    </style>
</head>
<body>
    <div id="toast">Copied to clipboard!</div>
    <!-- MASTER PIN ACCESSIBILITY LOCK BOX -->
    <div id="login-box">
        <h3 style="margin-top:0;">🔐 Local Vault Spreadsheet</h3>
        <p style="font-size: 13px; color: #666; margin-bottom: 16px; line-height: 1.4;">First time? Create any numeric PIN to set up your vault database. Returning? Type your PIN to securely decrypt your row cells.</p>
        <div class="input-group">
            <label for="pin-field">Numeric Master PIN</label>
            <input type="password" id="pin-field" inputmode="numeric" pattern="[0-9]*" placeholder="Enter Vault PIN">
        </div>
        <button class="btn-action-primary" onclick="unlockVaultInstance()">Unlock Sheet</button>
    </div>

    <!-- MAIN APP SCREEN SPREADSHEET MATRIX -->
    <div id="app" class="box">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaeaea; margin-bottom: 16px; padding-bottom: 10px;">
            <h3 style="margin:0;">📊 Credentials Spreadsheet Matrix</h3>
            <div style="display: flex; gap: 8px;">
                <button id="save-btn" title="Save Changes Internally" onclick="saveDataToDatabase()" style="font-size:16px;">💾</button>
                <button title="Disconnect Session Safely" onclick="lockVaultInstance()" style="font-size:16px; color:#666;">🚪</button>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="search-bar" placeholder="🔍 Filter spreadsheet rows..." oninput="filterSpreadsheet()">
        </div>

        <div class="toolbar">
            <input type="text" id="in-service" class="col-service" placeholder="Website / Service">
            <input type="text" id="in-url" class="col-url" placeholder="URL Link">
            <input type="text" id="in-user" class="col-user" placeholder="Username / Email">
            <input type="text" id="in-pass" class="col-pass" placeholder="Password (Optional)">
            <input type="text" id="in-notes" class="col-remarks" placeholder="Remarks and notes...">
            <button id="add-or-update-btn" title="Add Row" onclick="addRow()" style="padding: 10px 20px;">➕</button>
            <button id="cancel-edit-btn" title="Cancel Edit" onclick="cancelEditState()" style="display: none; padding: 10px;">❌</button>
        </div>

        <div class="spreadsheet-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 15%;">Service</th>
                        <th style="width: 20%;">URL Link</th>
                        <th style="width: 20%;">Username</th>
                        <th style="width: 15%;">Password</th>
                        <th style="width: 22%;">Remarks</th>
                        <th style="width: 8%; text-align:center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="rows-body"></tbody>
            </table>
        </div>
    </div>
<script>
    let sheetData = [];
    let activeNumericPin = "";
    let editingIndex = -1;
    let db = null;

    // Initialize HTML5 IndexedDB Sandbox Database natively on phone/PC storage
    const request = indexedDB.open("LocalVaultDB", 1);
    request.onupgradeneeded = function(e) {
        db = e.target.result;
        db.createObjectStore("encrypted_store", { keyPath: "id" });
    };
    request.onsuccess = function(e) { db = e.target.result; };
    request.onerror = function() { alert("Database initialization failed."); };

    function unlockVaultInstance() {
        const pinInput = document.getElementById("pin-field").value.trim();
        if (!pinInput || !/^\d+$/.test(pinInput)) { return alert("Numeric PIN is required."); }
        activeNumericPin = pinInput;

        const transaction = db.transaction(["encrypted_store"], "readonly");
        const store = transaction.objectStore("encrypted_store");
        const getReq = store.get("vault_blob");

        getReq.onsuccess = function() {
            if (getReq.result) {
                try {
                    const bytes = CryptoJS.AES.decrypt(getReq.result.blob, activeNumericPin);
                    const decryptedString = bytes.toString(CryptoJS.enc.Utf8);
                    if (!decryptedString) throw new Error();
                    sheetData = JSON.parse(decryptedString);
                } catch(e) { return alert("Access Denied: Incorrect PIN."); }
            } else {
                sheetData = [];
            }
            document.getElementById("login-box").style.display = "none";
            document.getElementById("app").style.display = "block";
            renderSpreadsheet(sheetData);
            setSaveIndicator(false);
        };
    }

    function renderSpreadsheet(dataToDisplay) {
        const tbody = document.getElementById("rows-body");
        tbody.innerHTML = "";
        if (dataToDisplay.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#999; padding:24px;">Spreadsheet empty.</td></tr>`;
            return;
        }
        dataToDisplay.forEach((row) => {
            const globalIndex = sheetData.indexOf(row);
            const tr = document.createElement("tr");
            const serviceStr = row.s || ""; const urlStr = row.url || "";
            const userStr = row.u || ""; const passStr = row.p || ""; const noteStr = row.n || "";

            tr.innerHTML = `
                <td><b>${esc(serviceStr)}</b></td>
                <td>
                    <a href="${esc(urlStr)}" target="_blank" style="color:#0066cc; text-decoration:none;">${esc(urlStr)}</a>
                    ${urlStr ? `<button class="copy-btn" onclick="copyTxt('${escJs(urlStr)}')">❏</button>` : ''}
                </td>
                <td><span>${esc(userStr)}</span> ${userStr ? `<button class="copy-btn" onclick="copyTxt('${escJs(userStr)}')">❏</button>` : ''}</td>
                <td>
                    <span class="pwd-cell" onclick="togglePass(this, '${escJs(passStr)}')">${passStr ? '••••••••' : ''}</span>
                    ${passStr ? `<button class="copy-btn" onclick="copyTxt('${escJs(passStr)}')">❏</button>` : ''}
                </td>
                <td style="color:#555; font-style:italic;">${esc(noteStr)}</td>
                <td style="text-align:center; white-space:nowrap;">
                    <button onclick="editRow(${globalIndex})" style="padding:6px 10px; margin-right:4px;">✏️</button>
                    <button onclick="deleteRow(${globalIndex})" style="padding:6px 10px; color:#df2222; border-color:#fdadad;">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function addRow() {
        const s = document.getElementById("in-service").value.trim();
        const url = document.getElementById("in-url").value.trim();
        const u = document.getElementById("in-user").value.trim();
        const p = document.getElementById("in-pass").value.trim();
        const n = document.getElementById("in-notes").value.trim();
        if (!s && !u && !n) return alert("Please fill out at least one field.");

        if (editingIndex > -1) {
            sheetData[editingIndex] = { s, url, u, p, n };
            cancelEditState();
        } else { sheetData.push({ s, url, u, p, n }); }
        
        document.getElementById("search-bar").value = "";
        renderSpreadsheet(sheetData);
        clearInputFields();
        setSaveIndicator(true);
    }

    function editRow(index) {
        editingIndex = index;
        const target = sheetData[index];
        document.getElementById("in-service").value = target.s || "";
        document.getElementById("in-url").value = target.url || "";
        document.getElementById("in-user").value = target.u || "";
        document.getElementById("in-pass").value = target.p || "";
        document.getElementById("in-notes").value = target.n || "";
        document.getElementById("add-or-update-btn").innerText = "📝";
        document.getElementById("cancel-edit-btn").style.display = "inline-flex";
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function cancelEditState() {
        editingIndex = -1;
        document.getElementById("add-or-update-btn").innerText = "➕";
        document.getElementById("cancel-edit-btn").style.display = "none";
        clearInputFields();
    }

    function deleteRow(idx) {
        if (confirm("Delete this entry?")) {
            if (editingIndex === idx) cancelEditState();
            sheetData.splice(idx, 1);
            document.getElementById("search-bar").value = "";
            renderSpreadsheet(sheetData);
            setSaveIndicator(true);
        }
    }

    function saveDataToDatabase() {
        try {
            const cipherText = CryptoJS.AES.encrypt(JSON.stringify(sheetData), activeNumericPin).toString();
            const transaction = db.transaction(["encrypted_store"], "readwrite");
            const store = transaction.objectStore("encrypted_store");
            
            store.put({ id: "vault_blob", blob: cipherText });
            transaction.oncomplete = function() {
                showToast("Vault encrypted & saved internally!");
                setSaveIndicator(false);
            };
        } catch(e) { alert("Save tracking database error."); }
    }

    function setSaveIndicator(isUnsaved) {
        const btn = document.getElementById("save-btn");
        btn.style.borderColor = isUnsaved ? "#df2222" : "#dcdcdc";
        btn.style.color = isUnsaved ? "#df2222" : "#111111";
    }

    function filterSpreadsheet() {
        const query = document.getElementById('search-bar').value.toLowerCase().trim();
        if (!query) { return renderSpreadsheet(sheetData); }
        const filtered = sheetData.filter(row => {
            return (row.s || '').toLowerCase().includes(query) || (row.url || '').toLowerCase().includes(query) ||
                   (row.u || '').toLowerCase().includes(query) || (row.n || '').toLowerCase().includes(query);
        });
        renderSpreadsheet(filtered);
    }

    function togglePass(element, realPass) {
        if (element.innerText === "••••••••") {
            element.innerText = realPass; element.style.color = "#111";
        } else { element.innerText = "••••••••"; element.style.color = "#0066cc"; }
    }

    function copyTxt(text) {
        const el = document.createElement("textarea"); el.value = text;
        el.style.position = "fixed"; el.style.left = "-9999px";
        document.body.appendChild(el); el.select();
        document.execCommand("copy"); document.body.removeChild(el);
        showToast("Copied to clipboard!");
    }

    function showToast(msg) {
        const toast = document.getElementById("toast"); toast.innerText = msg;
        toast.style.display = "block"; setTimeout(() => { toast.style.display = "none"; }, 2000);
    }

    function clearInputFields() {
        document.getElementById("in-service").value = ""; document.getElementById("in-url").value = "";
        document.getElementById("in-user").value = ""; document.getElementById("in-pass").value = "";
        document.getElementById("in-notes").value = "";
    }

    function lockVaultInstance() { location.reload(); }
    function esc(str) { return str ? str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }
    function escapeJs(str) { return str ? str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"') : ''; }
</script>
</body>
</html>
